services:
    _defaults:
        autowire: true
        autoconfigure: true

    Darkwood\IaExceptionBundle\Service\TraceFormatter:
        arguments:
            $fileLinkFormat: null

    Darkwood\IaExceptionBundle\Service\ExceptionAiAnalyzer:
        arguments:
            $cacheTtl: '%darkwood_ia_exception.cache_ttl%'
            $timeoutMs: '%darkwood_ia_exception.timeout_ms%'
            $includeTrace: '%darkwood_ia_exception.include_trace%'

    Darkwood\IaExceptionBundle\Service\ExceptionContextStore:
        arguments:
            $ttlSeconds: '%darkwood_ia_exception.async_context_ttl%'

    Darkwood\IaExceptionBundle\EventSubscriber\IaExceptionSubscriber:
        arguments:
            $enabled: '%darkwood_ia_exception.enabled%'
            $onlyStatusCodes: '%darkwood_ia_exception.only_status_codes%'
            $errorIdGenerator: '%darkwood_ia_exception.error_id_generator%'
            $async: '%darkwood_ia_exception.async%'
            $asyncRoutePrefix: '%darkwood_ia_exception.async_route_prefix%'
        tags:
            - { name: kernel.event_subscriber }

    Darkwood\IaExceptionBundle\Controller\AiExceptionController:
        public: true
        arguments:
            $enabled: '%darkwood_ia_exception.enabled%'
        tags:
            - { name: controller.service_arguments }

    Darkwood\IaExceptionBundle\Routing\RouteLoader:
        arguments:
            $routePrefix: '%darkwood_ia_exception.async_route_prefix%'
            $asyncEnabled: '%darkwood_ia_exception.async%'
        tags:
            - { name: routing.loader }
